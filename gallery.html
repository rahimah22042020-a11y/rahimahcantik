
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff0f5, #f3e8ff);
    color: #55445f;
    min-height: 100vh;
}

/* HEADER */
header {
    text-align: center;
    padding: 35px 20px;
}

header h1 {
    color: #a45b91;
    font-size: 30px;
    margin-bottom: 10px;
}

header p {
    color: #806d88;
    font-size: 14px;
}

/* TOMBOL KEMBALI */
.back-button {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 20px;
    background: #d9b8e8;
    color: white;
    text-decoration: none;
    border-radius: 20px;
    font-size: 13px;
    transition: 0.3s;
}

.back-button:hover {
    background: #b98bcf;
}

/* GALERI */
.gallery-container {
    max-width: 850px;
    margin: 10px auto 50px;
    padding: 0 20px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.gallery-card {
    background: white;
    padding: 10px;
    border-radius: 18px;
    box-shadow: 0 5px 15px rgba(120, 80, 130, 0.12);
    text-align: center;
    transition: 0.3s;
}

.gallery-card:hover {
    transform: translateY(-5px);
}

/* UKURAN FOTO */
.gallery-card img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    border-radius: 13px;
    display: block;
}

.gallery-card h3 {
    margin-top: 12px;
    font-size: 15px;
    color: #a45b91;
}

.gallery-card p {
    font-size: 12px;
    color: #887a91;
    margin-top: 5px;
    line-height: 1.5;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    color: #947e9c;
    font-size: 12px;
}

/* TAMPILAN HP */
@media (max-width: 600px) {
    .gallery-grid {
        grid-template-columns: 1fr;
        max-width: 350px;
        margin: auto;
    }

    .gallery-card img {
        height: 180px;
    }

    header h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header>
    <h1>My Gallery ♡</h1>
    <p>Kumpulan dokumentasi rumah</p>

    <a href="index.html" class="back-button">← Kembali ke Beranda</a>
</header>

<main class="gallery-container">
    <div class="gallery-grid">

        <div class="gallery-card">
            <img src="tampak depan" alt="Tampak Depan">
            <h3>Tampak Depan</h3>
            <p>Bagian depan rumah.</p>
        </div>

        <div class="gallery-card">
            <img src="tampak kanan" alt="Tampak Kanan">
            <h3>Tampak Kanan</h3>
            <p>Bagian kanan rumah.</p>
        </div>

        <div class="gallery-card">
            <img src="tampak kiri" alt="Tampak Kiri">
            <h3>Tampak Kiri</h3>
            <p>Bagian kiri rumah.</p>
        </div>

        <div class="gallery-card">
            <img src="tampak belakang" alt="Tampak Belakang">
            <h3>Tampak Belakang</h3>
            <p>Bagian belakang rumah.</p>
        </div>

    </div>
</main>

<footer>
    © 2026 My Personal Website ♡
</footer>

</body>
</html>
