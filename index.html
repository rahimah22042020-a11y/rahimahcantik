```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Gallery ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #fff5f9, #f4edff, #fdf2fa);
    color: #55445f;
    min-height: 100vh;
}

/* HEADER */
header {
    text-align: center;
    padding: 65px 20px 45px;
    position: relative;
}

header::before {
    content: "♡";
    position: absolute;
    top: 20px;
    left: 12%;
    font-size: 55px;
    color: #e9c9e8;
    opacity: 0.6;
}

header::after {
    content: "✿";
    position: absolute;
    top: 35px;
    right: 13%;
    font-size: 45px;
    color: #d9c5ed;
    opacity: 0.7;
}

header h1 {
    color: #a45b91;
    font-size: 39px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 10px;
    animation: fadeDown 0.8s ease;
}

header p {
    color: #927b9a;
    font-size: 14px;
    letter-spacing: 1px;
    animation: fadeDown 1s ease;
}

/* TOMBOL KEMBALI */
.back-button {
    display: inline-block;
    margin-top: 25px;
    padding: 11px 25px;
    background: linear-gradient(135deg, #d9b8e8, #c69bd9);
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 5px 15px rgba(180, 130, 190, 0.2);
    transition: 0.3s ease;
}

.back-button:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(180, 130, 190, 0.3);
    background: linear-gradient(135deg, #c69bd9, #b681cb);
}

/* GALERI */
.gallery-container {
    max-width: 950px;
    margin: 15px auto 60px;
    padding: 0 25px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 28px;
}

/* KARTU FOTO */
.gallery-card {
    background: rgba(255, 255, 255, 0.85);
    padding: 13px;
    border-radius: 22px;
    box-shadow: 0 8px 25px rgba(140, 100, 150, 0.10);
    text-align: center;
    transition: all 0.4s ease;
    border: 1px solid rgba(255, 255, 255, 0.9);
    animation: fadeUp 0.8s ease both;
}

.gallery-card:nth-child(2) {
    animation-delay: 0.15s;
}

.gallery-card:nth-child(3) {
    animation-delay: 0.3s;
}

.gallery-card:nth-child(4) {
    animation-delay: 0.45s;
}

.gallery-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 30px rgba(150, 105, 165, 0.18);
}

/* UKURAN FOTO */
.gallery-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 16px;
    display: block;
    transition: transform 0.5s ease;
}

.gallery-card:hover img {
    transform: scale(1.025);
}

.gallery-card h3 {
    margin-top: 17px;
    font-size: 17px;
    color: #a45b91;
    font-weight: 900;
}

.gallery-card p {
    font-size: 13px;
    color: #927f99;
    margin-top: 6px;
    line-height: 1.6;
    padding-bottom: 8px;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 25px 15px;
    color: #a18ba8;
    font-size: 12px;
    letter-spacing: 0.5px;
    border-top: 1px solid rgba(190, 155, 200, 0.15);
}

/* ANIMASI */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeDown {
    from {
        opacity: 0;
        transform: translateY(-15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* TAMPILAN HP */
@media (max-width: 600px) {
    header {
        padding: 55px 15px 35px;
    }

    header h1 {
        font-size: 29px;
    }

    header::before {
        left: 5%;
        font-size: 35px;
    }

    header::after {
        right: 5%;
        font-size: 32px;
    }

    .gallery-grid {
        grid-template-columns: 1fr;
        max-width: 380px;
        margin: auto;
        gap: 22px;
    }

    .gallery-card img {
        height: 210px;
    }

    .gallery-container {
        padding: 0 18px;
    }
}
</style>
</head>

<body>

<header>
    <h1>My Gallery ♡</h1>
    <p>Kumpulan dokumentasi rumah</p>

    <a href="index.html" class="back-button">← Kembali ke Beranda</a>
</header>

<main class="gallery-container">
    <div class="gallery-grid">

        <div class="gallery-card">
            <img src="tampak depan" alt="Tampak Depan">
            <h3>Tampak Depan</h3>
            <p>Bagian depan rumah.</p>
        </div>

        <div class="gallery-card">
            <img src="tampak kanan" alt="Tampak Kanan">
            <h3>Tampak Kanan</h3>
            <p>Bagian kanan rumah.</p>
        </div>

        <div class="gallery-card">
            <img src="tampak kiri" alt="Tampak Kiri">
            <h3>Tampak Kiri</h3>
            <p>Bagian kiri rumah.</p>
        </div>

        <div class="gallery-card">
            <img src="tampak belakang" alt="Tampak Belakang">
            <h3>Tampak Belakang</h3>
            <p>Bagian belakang rumah.</p>
        </div>

    </div>
</main>

<footer>
    © 2026 My Personal Website ♡
</footer>

</body>
</html>
```
