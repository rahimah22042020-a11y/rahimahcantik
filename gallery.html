
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Gallery | My Little Website</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Nunito', sans-serif;
    background: #fff8fc;
    color: #66566c;
}

/* NAVBAR */
.navbar {
    background: white;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 3px 15px #eacfe455;
}

.logo {
    font-size: 23px;
    font-weight: 900;
    color: #c47ba8;
}

.navbar a {
    text-decoration: none;
    color: #c47ba8;
    font-weight: 800;
}

/* HEADER */
.header {
    text-align: center;
    padding: 65px 20px;
    background: linear-gradient(135deg,#ffe5f0,#f2eaff,#fff5e8);
}

.header h1 {
    font-size: 42px;
    color: #795e83;
    margin-bottom: 12px;
}

.header p {
    color: #987f9c;
    font-size: 16px;
}

/* GALLERY */
.container {
    max-width: 1100px;
    margin: 55px auto;
    padding: 0 20px;
}

.section-title {
    text-align: center;
    margin-bottom: 35px;
}

.section-title h2 {
    color: #795e83;
    font-size: 30px;
}

.section-title p {
    color: #a493a7;
    margin-top: 8px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 30px;
}

/* FOTO CARD */
.gallery-card {
    background: white;
    padding: 15px;
    border-radius: 25px;
    box-shadow: 0 8px 25px #e6c9dd55;
    transition: .3s;
    overflow: hidden;
}

.gallery-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 30px #d9a9cb66;
}

.gallery-card img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    border-radius: 18px;
    display: block;
    transition: .4s;
}

.gallery-card:hover img {
    transform: scale(1.03);
}

.photo-info {
    text-align: center;
    padding: 20px 10px 10px;
}

.photo-info h3 {
    color: #c47ba8;
    font-size: 21px;
    margin-bottom: 7px;
}

.photo-info p {
    color: #9c899f;
    font-size: 14px;
}

/* DEKORASI */
.decoration {
    text-align: center;
    font-size: 25px;
    margin: 35px 0;
}

/* BUTTON */
.back {
    text-align: center;
    margin: 45px 0;
}

.back a {
    display: inline-block;
    padding: 14px 30px;
    background: #d98ab5;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-weight: 900;
    transition: .3s;
}

.back a:hover {
    background: #bc6e9b;
    transform: translateY(-4px);
}

/* FOOTER */
footer {
    background: #eac8df;
    text-align: center;
    padding: 25px;
    color: #74577d;
    font-weight: 800;
}

/* RESPONSIVE */
@media(max-width:650px) {
    .gallery-grid {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 32px;
    }

    .gallery-card img {
        height: 250px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">♡ My Website</div>
    <a href="index.html">⌂ Kembali ke Home</a>
</nav>

<!-- HEADER -->
<header class="header">
    <h1>Gallery 📸</h1>
    <p></p>
</header>

<!-- CONTENT -->
<main class="container">

    <div class="section-title">
        <h2>foto rumah</h2>
        <p></p>
    </div>

    <!-- GALLERY 4 FOTO -->
    <div class="gallery-grid">

        <!-- FOTO 1 -->
        <div class="galerry-card">
            <img src="tampak depan" alt="Foto Pertama">
            <div class="photo-info">
                <h3></h3>
                <p></p>
            </div>
        </div>

        <!-- FOTO 2 -->
        <div class="gallery-card">
            <img src="tampak kanan" alt="Foto Kedua">
            <div class="photo-info">
                <h3></h3>
                <p></p>
            </div>
        </div>

        <!-- FOTO 3 -->
        <div class="gallery-card">
            <img src="tampak kiri" alt="Foto Ketiga">
            <div class="photo-info">
                <h3></h3>
                <p></p>
            </div>
        </div>

        <!-- FOTO 4 -->
        <div class="gallery-card">
            <img src="tampak depan" alt="Foto Keempat">
            <div class="photo-info">
                <h3>My Little Story 🦋</h3>
                <p>Bagian kecil dari perjalanan hidup saya.</p>
            </div>
        </div>

    </div>

    <div class="decoration">
        🌷 ✨ ♡ 🌸
    </div>

    <!-- KEMBALI -->
    <div class="back">
        <a href="index.html">♡ Kembali ke Beranda</a>
    </div>

</main>

<!-- FOOTER -->
<footer>
    <p>♡ Made with Love ♡</p>
    <p>My Personal Website © 2026</p>
    <p>Keep Growing, Keep Shining! ✨</p>
</footer>

</body>
</html>
