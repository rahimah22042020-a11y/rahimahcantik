```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<!-- GSAP LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.2/ScrollTrigger.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff0f5, #f3e8ff);
    color: #55445f;
    min-height: 100vh;
    overflow-x: hidden;
}

/* HEADER */
header {
    text-align: center;
    padding: 35px 20px;
    position: relative;
}

header h1 {
    color: #a45b91;
    font-size: 30px;
    margin-bottom: 10px;
}

header p {
    color: #806d88;
    font-size: 14px;
}

/* HIASAN BACKGROUND */
.decoration {
    position: fixed;
    color: #d9b8e8;
    opacity: 0.5;
    pointer-events: none;
    z-index: -1;
    font-size: 25px;
}

.deco1 {
    top: 20%;
    left: 5%;
}

.deco2 {
    top: 45%;
    right: 7%;
}

.deco3 {
    bottom: 15%;
    left: 12%;
}

/* TOMBOL KEMBALI */
.back-button {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 20px;
    background: #d9b8e8;
    color: white;
    text-decoration: none;
    border-radius: 20px;
    font-size: 13px;
    transition: 0.3s;
}

.back-button:hover {
    background: #b98bcf;
}

/* GALERI */
.gallery-container {
    max-width: 850px;
    margin: 10px auto 50px;
    padding: 0 20px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.gallery-card {
    background: white;
    padding: 10px;
    border-radius: 18px;
    box-shadow: 0 5px 15px rgba(120, 80, 130, 0.12);
    text-align: center;
    transition: box-shadow 0.3s ease;
    overflow: hidden;
    will-change: transform, opacity;
}

.gallery-card:hover {
    box-shadow: 0 12px 25px rgba(120, 80, 130, 0.22);
}

/* UKURAN FOTO */
.gallery-card img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    border-radius: 13px;
    display: block;
    will-change: transform;
}

.gallery-card h3 {
    margin-top: 12px;
    font-size: 15px;
    color: #a45b91;
}

.gallery-card p {
    font-size: 12px;
    color: #887a91;
    margin-top: 5px;
    line-height: 1.5;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    color: #947e9c;
    font-size: 12px;
}

/* ANIMASI HIASAN */
.decoration {
    will-change: transform;
}

/* TAMPILAN HP */
@media (max-width: 600px) {
    .gallery-grid {
        grid-template-columns: 1fr;
        max-width: 350px;
        margin: auto;
    }

    .gallery-card img {
        height: 180px;
    }

    header h1 {
        font-size: 25px;
    }
}

/* MENGHORMATI PENGATURAN REDUKSI ANIMASI */
@media (prefers-reduced-motion: reduce) {
    * {
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<!-- HIASAN ANIMASI -->
<div class="decoration deco1">♡</div>
<div class="decoration deco2">✿</div>
<div class="decoration deco3">♡</div>

<header>
    <h1>My Gallery ♡</h1>
    <p>Kumpulan dokumentasi rumah</p>

    <a href="index.html" class="back-button">← Kembali ke Beranda</a>
</header>

<main class="gallery-container">
    <div class="gallery-grid">

        <div class="gallery-card">
            <img src="tampak depan" alt="Tampak Depan">
            <h3>Tampak Depan</h3>
            <p>Bagian depan rumah.</p>
        </div>

        <div class="gallery-card">
            <img src="tampak kanan" alt="Tampak Kanan">
            <h3>Tampak Kanan</h3>
            <p>Bagian kanan rumah.</p>
        </div>

        <div class="gallery-card">
            <img src="tampak kiri" alt="Tampak Kiri">
            <h3>Tampak Kiri</h3>
            <p>Bagian kiri rumah.</p>
        </div>

        <div class="gallery-card">
            <img src="tampak belakang" alt="Tampak Belakang">
            <h3>Tampak Belakang</h3>
            <p>Bagian belakang rumah.</p>
        </div>

    </div>
</main>

<footer>
    © 2026 My Personal Website ♡
</footer>

<!-- GSAP ANIMATION -->
<script>
gsap.registerPlugin(ScrollTrigger);

// CEK PENGATURAN ANIMASI
const reduceMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
).matches;

if (!reduceMotion) {

    // ANIMASI HEADER
    const intro = gsap.timeline();

    intro.from("header h1", {
        y: -40,
        opacity: 0,
        duration: 1,
        ease: "power3.out"
    })
    .from("header p", {
        y: 20,
        opacity: 0,
        duration: 0.8,
        ease: "power2.out"
    }, "-=0.5")
    .from(".back-button", {
        y: 15,
        opacity: 0,
        duration: 0.7,
        ease: "back.out(1.7)"
    }, "-=0.3");

    // ANIMASI KARTU FOTO
    gsap.from(".gallery-card", {
        y: 60,
        opacity: 0,
        scale: 0.94,
        duration: 1,
        stagger: 0.2,
        ease: "power3.out",
        delay: 0.5
    });

    // ANIMASI HIASAN MELAYANG
    gsap.to(".deco1", {
        y: -25,
        rotation: 15,
        duration: 3,
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut"
    });

    gsap.to(".deco2", {
        y: 30,
        rotation: -20,
        duration: 4,
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut"
    });

    gsap.to(".deco3", {
        y: -20,
        rotation: 12,
        duration: 3.5,
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut"
    });

    // ANIMASI HOVER FOTO
    document.querySelectorAll(".gallery-card").forEach(card => {

        const photo = card.querySelector("img");

        card.addEventListener("mouseenter", () => {
            gsap.to(card, {
                y: -8,
                scale: 1.025,
                duration: 0.35,
                ease: "power2.out"
            });

            gsap.to(photo, {
                scale: 1.07,
                duration: 0.5,
                ease: "power2.out"
            });
        });

        card.addEventListener("mouseleave", () => {
            gsap.to(card, {
                y: 0,
                scale: 1,
                duration: 0.4,
                ease: "power2.out"
            });

            gsap.to(photo, {
                scale: 1,
                duration: 0.5,
                ease: "power2.out"
            });
        });

    });

    // ANIMASI TOMBOL KEMBALI
    const button = document.querySelector(".back-button");

    button.addEventListener("mouseenter", () => {
        gsap.to(button, {
            scale: 1.08,
            duration: 0.3,
            ease: "back.out(2)"
        });
    });

    button.addEventListener("mouseleave", () => {
        gsap.to(button, {
            scale: 1,
            duration: 0.3,
            ease: "power2.out"
        });
    });

    // ANIMASI FOOTER SAAT MUNCUL
    gsap.from("footer", {
        opacity: 0,
        y: 20,
        duration: 1,
        scrollTrigger: {
            trigger: "footer",
            start: "top 95%"
        }
    });

}
</script>

</body>
</html>
```
